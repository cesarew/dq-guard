[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dq-guard"
version = "0.1.0"
description = "Zero-dependency declarative data quality checks for CSV/TSV, with first-class support for Chinese business data."
readme = "README.md"
# 下限 3.10：Python 3.9 已于 2025-10 停止支持，且 ubuntu-latest（Ubuntu 26.04）
# 的 actions/python-versions 清单里已不再提供 3.9，无法在 CI 中验证。
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "cesarew", email = "cesarew@users.noreply.github.com" },
]
keywords = [
  "data-quality",
  "data-governance",
  "data-engineering",
  "csv",
  "cli",
  "china",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Database",
]

# 核心零依赖：一个都不写
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
dq-guard = "dq_guard.cli:main"

[project.urls]
Homepage = "https://github.com/cesarew/dq-guard"
Issues = "https://github.com/cesarew/dq-guard/issues"

[tool.setuptools.packages.find]
include = ["dq_guard*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
