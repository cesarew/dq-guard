name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 下限 3.10：ubuntu-latest 已升级到 Ubuntu 26.04，其 actions/python-versions
        # 清单只提供 3.10–3.15（3.9 已于 2025-10 EOL 且不再提供）。
        # 保留 3.10 作下限、3.12 作中间、3.13 作当前稳定，两端 OS 都跑。
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 断言「运行时依赖必须为空」。
      # 注意：这里**不能用 tomllib** —— 它是 Python 3.11 才进标准库的，
      # 用它在 3.9/3.10 上会直接 ModuleNotFoundError，把一个环境限制
      # 伪装成「依赖检查失败」。改用正则读 pyproject，任何版本都能跑。
      - name: Show that the package really has zero runtime dependencies
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re
          text = pathlib.Path('pyproject.toml').read_text(encoding='utf-8')
          m = re.search(r'(?ms)^dependencies\s*=\s*\[(.*?)\]', text)
          assert m, 'dependencies key missing from pyproject.toml'
          body = m.group(1).strip()
          print('dependencies =', body or '<empty>')
          assert body == '', 'runtime dependencies must stay empty'
          PY

      - name: Unit tests (stdlib unittest, no install required)
        run: python -m unittest discover -s tests -v

      - name: Smoke test — example config must report failures and exit 1
        shell: bash
        run: |
          set +e
          python -m dq_guard examples/rules.json --report out/report.md
          code=$?
          set -e
          echo "exit code = $code"
          test "$code" -eq 1 || { echo "expected exit code 1"; exit 1; }
          test -f out/report.md

      - name: Smoke test — --fail-on none must exit 0
        shell: bash
        run: python -m dq_guard examples/rules.json --quiet --fail-on none

      - name: Only YAML config requires PyYAML
        run: |
          pip install PyYAML
          python -m dq_guard examples/rules.yaml --quiet --fail-on none

      # examples/demo.py 自带 23 项断言（三种退出码 + 修复后必须转绿）。
      # 跑它等于把「文档里承诺的行为」也纳入回归，避免 demo 随实现漂移。
      - name: Demo (self-verifying, 23 assertions)
        run: python examples/demo.py

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dq-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: out/
          if-no-files-found: ignore

  # 打包回归防护：单元测试全绿也可能打不出可安装的包。
  # 这个 job 用**隔离构建**（默认行为，会按 build-system.requires 现场装
  # setuptools>=77），所以它同时验证了两件事：
  #   1) PEP 639 的 license 写法在当前 setuptools 下不告警、元数据正确；
  #   2) build-system.requires 里那个版本 pin 真的能被解析出来。
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist and wheel (isolated, resolves build-system.requires)
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: twine check — fails on metadata problems
        run: python -m twine check dist/*

      - name: Install the wheel with --no-deps and run the console script
        run: |
          python -m venv /tmp/wheelvenv
          /tmp/wheelvenv/bin/pip install --no-deps dist/*.whl
          /tmp/wheelvenv/bin/dq-guard --list-rules
          /tmp/wheelvenv/bin/dq-guard examples/rules.json --quiet --fail-on none

      - name: Assert metadata — no runtime deps, PEP 639 license expression
        shell: bash
        run: |
          python - <<'PY'
          import glob, sys, zipfile

          whl = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(whl) as z:
              meta = z.read(next(n for n in z.namelist() if n.endswith("METADATA"))).decode()
          names = [n for n in zipfile.ZipFile(whl).namelist() if "LICENSE" in n.upper()]

          requires = [l for l in meta.splitlines() if l.startswith("Requires-Dist:")]
          hard = [r for r in requires if "extra ==" not in r]
          print("Requires-Dist (all):", requires or "<none>")
          print("hard requirements  :", hard or "<none>")
          print("License-Expression :", "yes" if "License-Expression: MIT" in meta else "MISSING")
          print("License-File       :", "yes" if "License-File: LICENSE" in meta else "MISSING")
          print("LICENSE in wheel   :", names or "MISSING")

          assert not hard, f"wheel declares runtime deps: {hard}"
          assert "License-Expression: MIT" in meta, "missing PEP 639 License-Expression"
          assert "License-File: LICENSE" in meta, "missing License-File"
          assert names, "LICENSE not shipped inside the wheel"
          print("metadata ok")
          PY

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

